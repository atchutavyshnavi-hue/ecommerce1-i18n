<div class="auth-page"><div class="auth-card"><div class="logo">Shop<span>Zone</span></div><h1>{{ 'auth.signIn' | translate }}</h1><form (ngSubmit)="login()"><label>{{ 'auth.email' | translate }}</label><input type="email" name="email" [(ngModel)]="email" [placeholder]="'auth.emailPlaceholder' | translate" /><label>{{ 'auth.password' | translate }}</label><input type="password" name="password" [(ngModel)]="password" [placeholder]="'auth.passwordPlaceholder' | translate" />@if (errorMessage) { <div class="error">{{ errorMessage }}</div> }<button type="submit">{{ 'auth.signInButton' | translate }}</button></form><div class="divider">{{ 'auth.newTo' | translate }}</div><a routerLink="/signup" class="create-account">{{ 'auth.createShopZone' | translate }}</a></div></div>
